services:
  filetransfer:
    build: .
    restart: unless-stopped
    ports:
      - "443:8443/tcp"
      - "3478:3478/udp"
    environment:
      FILETRANSFER_ORIGIN: ${FILETRANSFER_ORIGIN:?Set the public HTTPS origin}
      FILETRANSFER_TLS_CERT: /run/tls/fullchain.pem
      FILETRANSFER_TLS_KEY: /run/tls/privkey.pem
      FILETRANSFER_TURN_IP: ${FILETRANSFER_TURN_IP:-}
      FILETRANSFER_TURN_HOST: ${FILETRANSFER_TURN_HOST:-}
      FILETRANSFER_TURN_UDP: 0.0.0.0:3478
      FILETRANSFER_STUN_URLS: ${FILETRANSFER_STUN_URLS:-}
      FILETRANSFER_RELAY_KEY: ${FILETRANSFER_RELAY_KEY:-}
      FILETRANSFER_PUBLIC_DAILY_BYTES: ${FILETRANSFER_PUBLIC_DAILY_BYTES:-}
      FILETRANSFER_RESERVED_DAILY_BYTES: ${FILETRANSFER_RESERVED_DAILY_BYTES:-}
      FILETRANSFER_ADMIN_USERNAME: ${FILETRANSFER_ADMIN_USERNAME:?Set the administrator username}
      FILETRANSFER_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    volumes:
      - type: bind
        source: ${FILETRANSFER_TLS_CERT_PATH:?Set the host TLS certificate path}
        target: /run/tls/fullchain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FILETRANSFER_TLS_KEY_PATH:?Set the host TLS private key path}
        target: /run/tls/privkey.pem
        read_only: true
        bind:
          create_host_path: false
      - filetransfer_data:/var/lib/filetransfer
    secrets:
      - admin_password
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--insecure", "https://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

secrets:
  admin_password:
    file: ${FILETRANSFER_ADMIN_PASSWORD_PATH:?Set the host administrator password file path}

volumes:
  filetransfer_data:
